{#- One event card, shared by the homepage and /events/. The event's own page
    carries the description; cards just link to it. -#}
{% component event_card(event: map) %}
      <div class="event{% if event.extra.featured %} featured{% endif %}">
        <div class="when">
          {{<event_date date={event.extra.date} style="badge"/>}}
        </div>
        <div class="body">
          <h3><a href="{{ event.permalink }}">{{ event.title }}</a></h3>
          <div class="meta">
            <span><span class="icon icon-map-pin" aria-hidden="true"></span>{{ event.extra.location }}</span>
            <span><span class="icon icon-clock" aria-hidden="true"></span>{{ event.extra.time }}</span>
          </div>
          <p class="more"><a class="btn btn-primary" href="{{ event.permalink }}">More Details</a></p>
        </div>
      </div>
{% endcomponent event_card %}
