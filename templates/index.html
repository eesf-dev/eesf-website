{% extends "base.html" %}

{% block content %}
{% set events_section = get_section(path="events/_index.md") %}

<section class="block" id="events">
  <div class="wrap">
    <div class="section-head">
      <h2>Upcoming Events</h2>
      <a class="stacked-link" href="{{ get_url(path="rss.xml") }}">RSS<br>Feed</a>
    </div>

    <div class="events-list">
      {% for event in events_section.pages | sort(attribute="extra.date") %}
      {{<event_card event={event}/>}}
      {% endfor %}
    </div>
  </div>
</section>

{% endblock content %}
