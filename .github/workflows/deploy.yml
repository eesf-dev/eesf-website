name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild daily so events move from Upcoming to Past on their own. Runs twice
  # so one failed or dropped scheduled run doesn't skip a day, and off the hour
  # because GitHub is most likely to delay or drop runs scheduled at :00. Cron
  # is UTC only: 12:23 and 15:41 UTC are about 5am and 8:40am Pacific in summer,
  # an hour earlier in winter.
  schedule:
    - cron: "23 12 * * *"
    - cron: "41 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deploy finish, but skip any queued between it and the latest push.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZOLA_VERSION: 0.23.6
  # Zola's now() reads the machine clock, and events are Pacific-local: without
  # this a build between 5pm and midnight PT would already be on tomorrow's date
  # and could file that evening's event under Past while it was happening.
  TZ: America/Los_Angeles

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin zola
          zola --version

      - uses: actions/configure-pages@v5

      - name: Build site
        run: zola build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
