<!doctype html>
<html lang="{{ config.default_language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <link rel="alternate" type="application/rss+xml" title="{{ config.title }} feed" href="{{ get_url(path="rss.xml") }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="{{ get_url(path="style.css") }}">
</head>
<body>
  <main>
    {% block content %}{% endblock content %}
  </main>

  <footer>
    <div class="wrap">
      <div class="foot-grid">
        <div class="brand">{{ config.extra.brand_short }}</div>
        <div class="foot-links">
          <a href="{{ get_url(path="rss.xml") }}">RSS</a>
          <a href="mailto:{{ config.extra.organizer_email }}">Contact</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="{{ get_url(path="theme.js") }}"></script>
  <script src="{{ get_url(path="procs.js") }}"></script>
</body>
</html>
