{% extends "base.html" %}

{% block title %}Events · {{ config.title }}{% endblock title %}

{% block content %}
<section class="block">
  <div class="wrap">
    <p class="eyebrow"><a href="{{ get_url(path="@/_index.md") }}">&larr; {{ config.extra.brand_short }}</a></p>
    <h1 style="margin-top: 10px;">All events</h1>
    <div class="events-list" style="margin-top: 28px;">
      {% for event in section.pages | sort(attribute="extra.date") %}
      {{<event_card event={event}/>}}
      {% endfor %}
    </div>
  </div>
</section>
{% endblock content %}
