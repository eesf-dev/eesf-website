# EESF — Erlang Ecosystem San Francisco Bay Area
# base_url must match the domain GitHub Pages serves the site from.
base_url = "https://eesf.dev"
title = "Erlang Ecosystem SF"
description = "A list of events in the San Francisco Bay Area related to the Erlang ecosystem (Erlang, Elixir, Gleam, etc.)"
default_language = "en"

compile_sass = false
build_search_index = false
generate_feeds = true
# Feed(s) available at /rss.xml (and /atom.xml if you add that filename too).
feed_filenames = ["rss.xml"]

[markdown]
smart_punctuation = true

[extra]
brand_short = "EESF"
brand_full = "Erlang Ecosystem San Francisco"
organizer_email = "hello@eesf.dev"
